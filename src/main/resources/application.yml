spring:
  application:
    name: catalyst-radar

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: catalyst-radar
    version: 0.0.1-SNAPSHOT

catalyst:
  ingestion:
    enabled: false
    interval: PT30M
    lookback: PT2H
    provider: polygon
    fallback-provider: finnhub
    page-size: 50
  polygon:
    base-url: https://api.polygon.io
    # Never commit a real key: export POLYGON_API_KEY in the environment.
    api-key: ${POLYGON_API_KEY:}
  finnhub:
    base-url: https://finnhub.io
    # Never commit a real key: export FINNHUB_API_KEY in the environment.
    api-key: ${FINNHUB_API_KEY:}
  openai:
    base-url: https://api.openai.com
    # Never commit a real key: export OPENAI_API_KEY in the environment.
    api-key: ${OPENAI_API_KEY:}
    extraction-model: ${CATALYST_OPENAI_EXTRACTION_MODEL:gpt-4o-mini}
    embedding-model: text-embedding-3-small
