spring:
  application:
    name: catalyst-radar
  datasource:
    # Local compose defaults; override per environment. Never commit secrets.
    url: ${CATALYST_DB_URL:jdbc:postgresql://localhost:5432/catalyst_radar}
    username: ${CATALYST_DB_USER:catalyst}
    password: ${CATALYST_DB_PASSWORD:catalyst}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
        allowed-methods: GET
        allowed-headers: Authorization,X-Admin-Key,X-Request-Id,Content-Type,Accept
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: catalyst-radar
    version: 0.0.1-SNAPSHOT

catalyst:
  api:
    # Local development needs no keys; enable explicitly to test auth.
    auth-enabled: false
  internal:
    # Always required for /internal/*, even locally. Never commit a real value.
    admin-key: ${CATALYST_INTERNAL_ADMIN_KEY:}
  ui:
    # Dashboard origins for browser CORS, including filter denials.
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  ingestion:
    enabled: false
    interval: PT30M
    lookback: PT2H
    provider: polygon
    fallback-provider: finnhub
    page-size: 50
  pipeline:
    batch-size: 50
    max-attempts: 3
    retry-delay: PT1M
  snapshots:
    enabled: false
    interval: PT24H
  polygon:
    base-url: https://api.polygon.io
    # Never commit a real key: export POLYGON_API_KEY in the environment.
    api-key: ${POLYGON_API_KEY:}
  finnhub:
    base-url: https://finnhub.io
    # Never commit a real key: export FINNHUB_API_KEY in the environment.
    api-key: ${FINNHUB_API_KEY:}
  openai:
    base-url: https://api.openai.com
    # Never commit a real key: export OPENAI_API_KEY in the environment.
    api-key: ${OPENAI_API_KEY:}
    extraction-model: ${CATALYST_OPENAI_EXTRACTION_MODEL:gpt-4o-mini}
    embedding-model: text-embedding-3-small
