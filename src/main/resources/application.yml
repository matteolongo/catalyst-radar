spring:
  application:
    name: catalyst-radar

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: catalyst-radar
    version: 0.0.1-SNAPSHOT

catalyst:
  polygon:
    base-url: https://api.polygon.io
    # Never commit a real key: export POLYGON_API_KEY in the environment.
    api-key: ${POLYGON_API_KEY:}
